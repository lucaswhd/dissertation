# Combo D — 厨房·热狗+培根 (house_single_floor / kitchen)
# Round 0 = Cook hot dogs   (replay task-0045, external)
# Round 1 = Cook bacon      (replay task-0046 segment 0, base)
#
# 物体重叠度探测 (scene_file objects 对比, 2026-05-29):
#   task-0045 (hot_dogs): 260 objects
#   task-0046 (bacon):    266 objects
#   共享: 258  |  0045 独有: 2 (hotdog_207, hotdog_208)  |  0046 独有: 8
# → external 仅 2 个独有物体 (两根热狗), 是 5 组合里最干净的配对。
raw_hdf5: /root/autodl-tmp/datasets/2025-challenge-rawdata/task-0046/episode_00460010.hdf5
output_dir: /root/autodl-tmp/outputs/hrc_combo_D

# Human (Habitat male_0) — 与组合 A 共用同一资源
human_usd: /root/hrc_pipeline/assets/character.usda
human_motion_mode: walk
human_distance: 1.8

# Rendering / pacing — 直接抄 hrc_multitask_v01.yaml 验证过的值
resolution: 256
fps: 30
head_camera_pitch_deg: -15
head_camera_pitch_axis: x
head_camera_horizontal_aperture: 45.0
head_camera_phase_pitch:
  WaitNearHuman:        0
  ReceiveCommand:       0
  FaceHuman:            0
  WaitNextCommand:      0
  AllTasksDone:         0
  GoToTask:           -10
  ReturnToHuman:      -10
  Relocate:           -10
  ExecuteBehaviorTask: -25
  TaskSegmentDone:    -15
head_camera_pitch_smooth_deg_per_frame: 1.0
return_steps: 90
go_to_task_steps: 90
face_human_steps: 45
wait_steps: 5
stand_off: 1.0
relocate_steps: 120

episode_id: 0
require_task_success: false
max_playback_steps: null

# === Extra objects spawned on top of task-0046's (bacon) scene ===
# task-0045 (hot_dogs) 相对 task-0046 仅 2 个独有可交互物体: 两根热狗。
# 它们不在 task-0046 录制 state 里, 故 UUID 在 load_state(serialized=True)
# 时被跳过, 保持下面的 spawn 位姿。名字必须与 task-0045 录制完全一致 (决定 UUID),
# 这样 Round 0 回放 task-0045 时录制的抓取动作能落到正确的对象上。
# Pose 从 task-0045 录制 state.registry.object_registry[name].root_link 读出。
extra_objects:
  - name: hotdog_207
    category: hotdog
    model: lsajfg
    position: [7.66189432144165, -1.849505066871643, 0.9138544201850891]
    orientation: [-0.02867845445871353, -0.02332809753715992, 0.8516595363616943, 0.5227900147438049]
    in_rooms: [kitchen_0]
  - name: hotdog_208
    category: hotdog
    model: lsajfg
    position: [7.942324161529541, -1.8063545227050781, 0.5017811059951782]
    orientation: [-0.04011690616607666, -0.0042348760180175304, 0.8425171971321106, 0.5371570587158203]
    in_rooms: [kitchen_0]

# === Task-round plan ===
task_rounds:
  # Round 0: REAL replay of task-0045 (cook_hot_dogs).
  # 合并场景 (task-0046 base + spawned 两根热狗) 覆盖了 task-0045 录制引用的全部
  # 260 个对象, 故可完整回放。task-0045 reward 在 step 6752 (~结尾) 才 spike,
  # 因此回放全部 6805 步, 让机器人走完完整自然动作序列。
  - kind: replay_external_segment
    instruction: "Take the two hot dogs out of the refrigerator in the kitchen and cook them in the microwave until both are cooked."
    external_hdf5: /root/autodl-tmp/datasets/2025-challenge-rawdata/task-0045/episode_00450010.hdf5
    episode_id: 0
    start_step: 0

  # Round 1: replay task-0046 (cook_bacon) 第一段。
  # task-0046 reward 首次 spike@4508 (第一个子目标), 最终 terminated@8392。
  # end_step 设在首个 reward 附近, 对应"完成培根烹饪第一阶段"。
  - kind: replay_segment
    instruction: "Take the tray of bacon out of the refrigerator and start cooking it in the frying pan on the stove."
    activity_override: cook_bacon
    segment_index: 0
    end_step: 4520
